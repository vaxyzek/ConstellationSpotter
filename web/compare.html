<!doctype html>
<meta charset="utf-8">
<title>Constellation line check — IAU vs. recreated</title>
<link rel="stylesheet" href="compare.css">

<header>
  <div class="nav">
    <a href="index.html" class="dim">← game</a>
    <button id="prev" title="Previous (←)">←</button>
    <select id="picker"></select>
    <button id="next" title="Next (→)">→</button>
    <span id="counter" class="dim"></span>
  </div>

  <div class="verdicts">
    <button data-verdict="ok" class="ok" title="Lines match (y)">✓ match</button>
    <button data-verdict="bad" class="bad" title="Lines wrong (n)">✗ flag</button>
    <span id="progress" class="dim"></span>
    <button id="export">export report</button>
  </div>
</header>

<div class="opts">
  <label><input type="checkbox" id="labels" checked> star labels</label>
  <label><input type="checkbox" id="boundaries" checked> boundaries</label>
  <label><input type="checkbox" id="neighbours" checked> neighbour figures</label>
  <label><input type="checkbox" id="grid" checked> grid</label>
  <label><input type="checkbox" id="trueColor"> star colour</label>
  <label>limit mag <input type="range" id="mag" min="3" max="6.5" step="0.1" value="6.5">
    <output id="magOut">6.5</output></label>
  <label>zoom <input type="range" id="zoom" min="0.5" max="2.5" step="0.05" value="1">
    <output id="zoomOut">1.00×</output></label>
</div>

<main>
  <figure>
    <figcaption>IAU / Sky &amp; Telescope reference chart</figcaption>
    <img id="iau" alt="IAU constellation chart">
  </figure>
  <figure>
    <figcaption>Recreated from star coordinates + line data <span id="meta" class="dim"></span></figcaption>
    <canvas id="render"></canvas>
  </figure>
</main>

<script type="module" src="compare.js"></script>
